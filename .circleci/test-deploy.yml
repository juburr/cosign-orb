            # For v1, we can only use exact issuer match (no regexp support for identity)
            OIDC_ISSUER=$(echo "${PAYLOAD}" | jq -r '.iss')
            PROJECT_ID=$(echo "${PAYLOAD}" | jq -r '.["oidc.circleci.com/project-id"]')
            OIDC_SUBJECT_REGEXP="https://circleci.com/api/v2/projects/${PROJECT_ID}/pipeline-definitions/.*"
            echo "export OIDC_ISSUER='${OIDC_ISSUER}'" >> "${BASH_ENV}"
            echo "export OIDC_SUBJECT_REGEXP='${OIDC_SUBJECT_REGEXP}'" >> "${BASH_ENV}"
            echo "OIDC Issuer: ${OIDC_ISSUER}"
            echo "OIDC Subject Regexp: ${OIDC_SUBJECT_REGEXP} (will be skipped for v1)"
      - cosign-orb/sign_blob:
          blob: testblob.txt
          keyless: true
          signature_output: testblob.txt.sig
          certificate_output: testblob.txt.crt
      - run:
          name: Verify signature and certificate files were created
          command: |
            if [[ ! -f testblob.txt.sig ]]; then
              echo "ERROR: Signature file was not created"
              exit 1
            fi
            echo "Signature file exists: testblob.txt.sig"
            if [[ ! -f testblob.txt.crt ]]; then
              echo "ERROR: Certificate file was not created"
              exit 1
            fi
            echo "Certificate file exists: testblob.txt.crt"
      - cosign-orb/verify_blob:
          blob: testblob.txt
          signature: testblob.txt.sig
          certificate: testblob.txt.crt
          keyless: true
          certificate_oidc_issuer: ${OIDC_ISSUER}
          certificate_identity_regexp: ${OIDC_SUBJECT_REGEXP}

  # Integration test: keyless attest and verify with Cosign v1
  # Note: v1 keyless verification only supports exact identity match (no regexp).
  # Since pipeline-definition-id changes per run, we verify with issuer only.
  # The orb will warn that identity verification is skipped for v1.
  integration-test-keyless-attest-v1:
    docker:
      - image: cimg/base:current-22.04
    environment:
      IMAGE_TTL: 1h
    steps:
      - checkout
      - setup_remote_docker:
          docker_layer_caching: true
      - cosign-orb/install:
          version: "1.13.6"
      - cosign-orb/check_oidc
      - run:
          name: Generate unique image reference
          command: |
            IMAGE_UUID=$(echo "${CIRCLE_WORKFLOW_ID}" | head -c 8)
            IMAGE_REF="ttl.sh/cosign-orb-keyless-attest-v1-${IMAGE_UUID}:${IMAGE_TTL}"
            echo "export IMAGE_REF='${IMAGE_REF}'" >> "${BASH_ENV}"
            echo "Test image: ${IMAGE_REF}"
      - run:
          name: Build and push test image
          command: |
            # SECURITY: ttl.sh is a third-party service. DO NOT include sensitive data in test images.
            echo "Test image built at $(date -u +%Y-%m-%dT%H:%M:%SZ)" > testfile.txt
            printf 'FROM scratch\nCOPY testfile.txt /testfile.txt\n' > Dockerfile
            docker build -t "${IMAGE_REF}" .
            docker push "${IMAGE_REF}"
            echo "Pushed test image to ${IMAGE_REF}"
      - run:
          name: Extract OIDC claims for verification
          command: |
            # Get the Sigstore-audience token to extract claims
            SIGSTORE_TOKEN=$(circleci run oidc get --claims '{"aud": "sigstore"}')
            decode_jwt_part() {
              local part="$1"
              local b64=$(echo "$part" | tr '_-' '/+')
              local pad=$((4 - ${#b64} % 4))
              if [[ $pad -ne 4 ]]; then
                b64="${b64}$(printf '=%.0s' $(seq 1 $pad))"
              fi
              echo "$b64" | base64 -d 2>/dev/null
            }
            PAYLOAD=$(decode_jwt_part "$(echo "${SIGSTORE_TOKEN}" | cut -d. -f2)")
            # For v1, we can only use exact issuer match (no regexp support for identity)
            OIDC_ISSUER=$(echo "${PAYLOAD}" | jq -r '.iss')
            PROJECT_ID=$(echo "${PAYLOAD}" | jq -r '.["oidc.circleci.com/project-id"]')
            OIDC_SUBJECT_REGEXP="https://circleci.com/api/v2/projects/${PROJECT_ID}/pipeline-definitions/.*"
            echo "export OIDC_ISSUER='${OIDC_ISSUER}'" >> "${BASH_ENV}"
            echo "export OIDC_SUBJECT_REGEXP='${OIDC_SUBJECT_REGEXP}'" >> "${BASH_ENV}"
            echo "OIDC Issuer: ${OIDC_ISSUER}"
            echo "OIDC Subject Regexp: ${OIDC_SUBJECT_REGEXP} (will be skipped for v1)"
      - run:
          name: Create test attestation predicate
          command: |
            printf '{"buildType":"https://example.com/test-build","builder":{"id":"https://circleci.com"},"invocation":{"configSource":{}}}\n' > predicate.json
      - cosign-orb/attest:
          image: ${IMAGE_REF}
          predicate: predicate.json
          predicate_type: slsaprovenance
          keyless: true
      - cosign-orb/verify_attestation:
          image: ${IMAGE_REF}
          predicate_type: slsaprovenance
          keyless: true
          certificate_oidc_issuer: ${OIDC_ISSUER}
          certificate_identity_regexp: ${OIDC_SUBJECT_REGEXP}

workflows:
  test-deploy:
    jobs:
      # Install tests - no context needed
      - test-install-default:
          filters: *filters
      - test-install-v3:
          filters: *filters
      - test-install-v2:
          filters: *filters
      - test-install-v1:
          filters: *filters
      - test-install-checksum-strict:
          filters: *filters

      # OIDC check command test
      - test-check-oidc:
          filters: *filters

      # Integration tests - generate throwaway keys, no context needed
      - integration-test-v3:
          filters: *filters
      - integration-test-v2:
          filters: *filters
      - integration-test-v1:
          filters: *filters

      # Image reference tests - tag and digest references against a registry with a port
      - integration-test-image-refs:
          name: integration-test-image-refs-<< matrix.digest_tool >>-v<< matrix.version >>
          matrix:
            parameters:
              digest_tool: ["crane", "docker"]
              version: ["3.1.3", "2.6.5", "1.13.6"]
          filters: *filters

      # Signature storage format tests - bundle_format pins the registry layout
      - integration-test-bundle-format:
          name: integration-test-bundle-format-<< matrix.bundle_format >>-v<< matrix.version >>
          matrix:
            parameters:
              version: ["3.1.3", "2.6.5"]
              bundle_format: ["bundle", "legacy"]
          filters: *filters

      # Blob integration tests - generate throwaway keys, no context needed
      - integration-test-blob-v3:
          filters: *filters
      - integration-test-blob-v2:
          filters: *filters
      - integration-test-blob-v1:
          filters: *filters

      # Keyless signing integration tests - uses CircleCI OIDC
      - integration-test-keyless-v3:
          filters: *filters
      - integration-test-keyless-v2:
          filters: *filters
      - integration-test-keyless-v1:
          filters: *filters

      # Keyless attestation integration tests - uses CircleCI OIDC
      - integration-test-keyless-attest-v3:
          filters: *filters
      - integration-test-keyless-attest-v2:
          filters: *filters
      - integration-test-keyless-attest-v1:
          filters: *filters

      # Keyless blob signing integration tests - uses CircleCI OIDC
      - integration-test-keyless-blob-v3:
          filters: *filters
      - integration-test-keyless-blob-v2:
          filters: *filters
      - integration-test-keyless-blob-v1:
          filters: *filters

      # Orb publishing
      - orb-tools/pack:
          filters: *release-filters
      - orb-tools/publish:
          orb_name: juburr/cosign-orb
          vcs_type: << pipeline.project.type >>
          pub_type: production
          requires:
            - orb-tools/pack
            - test-install-default
            - test-install-v3
            - test-install-v2
            - test-install-v1
            - test-install-checksum-strict
            - integration-test-v3
            - integration-test-v2
            - integration-test-v1
            - integration-test-image-refs
            - integration-test-bundle-format
            - integration-test-blob-v3
            - integration-test-blob-v2
            - integration-test-blob-v1
            - integration-test-keyless-v3
            - integration-test-keyless-v2
            - integration-test-keyless-v1
            - integration-test-keyless-attest-v3
            - integration-test-keyless-attest-v2
            - integration-test-keyless-attest-v1
            - integration-test-keyless-blob-v3
            - integration-test-keyless-blob-v2
            - integration-test-keyless-blob-v1
          context: orb-publishing
          filters: *release-filters
