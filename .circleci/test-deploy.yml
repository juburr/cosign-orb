version: 2.1
orbs:
  # Your orb will be automatically injected here during the pipeline.
  # Reference your orb's jobs and commands below as they will exist when built.
  orb-tools: circleci/orb-tools@12.3
  # The orb definition is intentionally not included here. It will be injected into the pipeline.
  cosign-orb: {}

# Use this tag to ensure test jobs always run,
# even though the downstream publish job will only run on release tags.
filters: &filters
  tags:
    only: /.*/

# Filter for release tags.
release-filters: &release-filters
  branches:
    ignore: /.*/
  tags:
    only: /^v[0-9]+\.[0-9]+\.[0-9]+$/

executors:
  docker-executor:
    docker:
      - image: cimg/base:current-22.04

jobs:
  # Test install command with the default version
  test-install-default:
    executor: docker-executor
    steps:
      - checkout
      - cosign-orb/install
      - run:
          name: Verify Cosign installed
          command: command -v cosign
      - run:
          name: Verify Cosign version is v3.1.3
          command: |
            VERSION=$(cosign version --json 2>&1 | jq -r '.gitVersion')
            echo "Installed version: ${VERSION}"
            if [[ "${VERSION}" != "v3.1.3" ]]; then
              echo "ERROR: Expected v3.1.3, got ${VERSION}"
              exit 1
            fi

  # Test install command with specific v3 version
  test-install-v3:
    executor: docker-executor
    steps:
      - checkout
      - cosign-orb/install:
          version: "3.0.3"
      - run:
          name: Verify Cosign version
          command: |
            VERSION=$(cosign version --json 2>&1 | jq -r '.gitVersion')
            echo "Installed version: ${VERSION}"
            if [[ "${VERSION}" != "v3.0.3" ]]; then
              echo "ERROR: Expected v3.0.3, got ${VERSION}"
              exit 1
            fi

  # Test install command with specific v2 version
  test-install-v2:
    executor: docker-executor
    steps:
      - checkout
      - cosign-orb/install:
          version: "2.5.3"
      - run:
          name: Verify Cosign version
          command: |
            VERSION=$(cosign version --json 2>&1 | jq -r '.gitVersion')
            echo "Installed version: ${VERSION}"
            if [[ "${VERSION}" != "v2.5.3" ]]; then
              echo "ERROR: Expected v2.5.3, got ${VERSION}"
              exit 1
            fi

  # Test install command with specific v1 version
  test-install-v1:
    executor: docker-executor
    steps:
      - checkout
      - cosign-orb/install:
          version: "1.13.6"
      - run:
          name: Verify Cosign version
          command: |
            VERSION=$(cosign version --json 2>&1 | jq -r '.gitVersion')
            echo "Installed version: ${VERSION}"
            if [[ "${VERSION}" != "v1.13.6" ]]; then
              echo "ERROR: Expected v1.13.6, got ${VERSION}"
              exit 1
            fi

  # Test install with strict checksum verification
  test-install-checksum-strict:
    executor: docker-executor
    steps:
      - checkout
      - cosign-orb/install:
          version: "3.1.3"
          verify_checksums: strict
      - run:
          name: Verify install succeeded with strict checksums
          command: cosign version

  # Integration test: sign and verify image with Cosign v3
  integration-test-v3:
    docker:
      - image: cimg/base:current-22.04
    environment:
      IMAGE_TTL: 1h
    steps:
      - checkout
      - setup_remote_docker:
          docker_layer_caching: true
      - cosign-orb/install:
          version: "3.1.3"
      - cosign-orb/generate_key_pair:
          password: "test-password-v3"
      - run:
          name: Generate unique image reference
          command: |
            # Use CircleCI workflow ID for uniqueness
            IMAGE_UUID=$(echo "${CIRCLE_WORKFLOW_ID}" | head -c 8)
            IMAGE_REF="ttl.sh/cosign-orb-test-${IMAGE_UUID}:${IMAGE_TTL}"
            echo "export IMAGE_REF='${IMAGE_REF}'" >> "${BASH_ENV}"
            echo "Test image: ${IMAGE_REF}"
      - run:
          name: Build and push test image
          command: |
            # SECURITY: ttl.sh is a third-party service. DO NOT include sensitive data in test images.
            echo "Test image built at $(date -u +%Y-%m-%dT%H:%M:%SZ)" > testfile.txt
            printf 'FROM scratch\nCOPY testfile.txt /testfile.txt\n' > Dockerfile
            docker build -t "${IMAGE_REF}" .
            # Push directly to ttl.sh (anonymous push supported)
            docker push "${IMAGE_REF}"
            echo "Pushed test image to ${IMAGE_REF}"
      - cosign-orb/sign_image:
          image: ${IMAGE_REF}
          annotations: "build.source=circleci,build.version=v3"
      - cosign-orb/verify_image:
          image: ${IMAGE_REF}
      - run:
          name: Verify annotations are present in signature
          command: |
            # Verify signature with annotation check - fails if annotation doesn't match
            # Check both annotations to verify comma-separated parsing works
            printf '%s' "${COSIGN_PUBLIC_KEY}" | base64 --decode > cosign-verify.pub
            cosign verify --key cosign-verify.pub --private-infrastructure -a build.source=circleci -a build.version=v3 "${IMAGE_REF}"
            rm -f cosign-verify.pub
            echo "Annotations verified successfully"
      - run:
          name: Create test attestation predicate
          command: |
            printf '{"buildType":"https://example.com/test-build","builder":{"id":"https://circleci.com"},"invocation":{"configSource":{}}}\n' > predicate.json
      - cosign-orb/attest:
          image: ${IMAGE_REF}
          predicate: predicate.json
          predicate_type: slsaprovenance
      - cosign-orb/verify_attestation:
          image: ${IMAGE_REF}
          predicate_type: slsaprovenance
      - run:
          name: Read the test image digest
          command: |
            # The image was pushed to one repository only, so RepoDigests has one entry.
            IMAGE_DIGEST_REF=$(docker image inspect --format '{{index .RepoDigests 0}}' "${IMAGE_REF}")
            if [[ ! "${IMAGE_DIGEST_REF}" =~ ^ttl\.sh/[^@]+@sha256:[0-9a-f]{64}$ ]]; then
              echo "ERROR: unexpected digest reference '${IMAGE_DIGEST_REF}'"
              exit 1
            fi
            echo "export IMAGE_DIGEST_REF='${IMAGE_DIGEST_REF}'" >> "${BASH_ENV}"
            echo "Digest reference: ${IMAGE_DIGEST_REF}"
      # Digest reference on a registry without a port. The old parser turned
      # repo@sha256:<hex> into repo@sha256@sha256:<hex>.
      - cosign-orb/sign_image:
          image: ${IMAGE_DIGEST_REF}
      - cosign-orb/attest:
          image: ${IMAGE_DIGEST_REF}
          predicate: predicate.json
          predicate_type: slsaprovenance
      - cosign-orb/verify_image:
          image: ${IMAGE_DIGEST_REF}
      - cosign-orb/verify_attestation:
          image: ${IMAGE_DIGEST_REF}
          predicate_type: slsaprovenance

  # Integration test: sign and verify image with Cosign v2
  integration-test-v2:
    docker:
      - image: cimg/base:current-22.04
    environment:
      IMAGE_TTL: 1h
    steps:
      - checkout
      - setup_remote_docker:
          docker_layer_caching: true
      - cosign-orb/install:
          version: "2.5.3"
      - cosign-orb/generate_key_pair:
          password: "test-password-v2"
      - run:
          name: Generate unique image reference
          command: |
            IMAGE_UUID=$(echo "${CIRCLE_WORKFLOW_ID}" | head -c 8)
            # Use different suffix to avoid collision with v3 test
            IMAGE_REF="ttl.sh/cosign-orb-test-v2-${IMAGE_UUID}:${IMAGE_TTL}"
            echo "export IMAGE_REF='${IMAGE_REF}'" >> "${BASH_ENV}"
            echo "Test image: ${IMAGE_REF}"
      - run:
          name: Build and push test image
          command: |
            # SECURITY: ttl.sh is a third-party service. DO NOT include sensitive data in test images.
            echo "Test image built at $(date -u +%Y-%m-%dT%H:%M:%SZ)" > testfile.txt
            printf 'FROM scratch\nCOPY testfile.txt /testfile.txt\n' > Dockerfile
            docker build -t "${IMAGE_REF}" .
            # Push directly to ttl.sh (anonymous push supported)
            docker push "${IMAGE_REF}"
            echo "Pushed test image to ${IMAGE_REF}"
      - cosign-orb/sign_image:
          image: ${IMAGE_REF}
          annotations: "build.source=circleci,build.version=v2"
      - cosign-orb/verify_image:
          image: ${IMAGE_REF}
      - run:
          name: Verify annotations are present in signature
          command: |
            # Verify signature with annotation check - fails if annotation doesn't match
            # Check both annotations to verify comma-separated parsing works
            printf '%s' "${COSIGN_PUBLIC_KEY}" | base64 --decode > cosign-verify.pub
            cosign verify --key cosign-verify.pub --private-infrastructure -a build.source=circleci -a build.version=v2 "${IMAGE_REF}"
            rm -f cosign-verify.pub
            echo "Annotations verified successfully"
      - run:
          name: Create test attestation predicate
          command: |
            printf '{"buildType":"https://example.com/test-build","builder":{"id":"https://circleci.com"},"invocation":{"configSource":{}}}\n' > predicate.json
      - cosign-orb/attest:
          image: ${IMAGE_REF}
          predicate: predicate.json
          predicate_type: slsaprovenance
      - cosign-orb/verify_attestation:
          image: ${IMAGE_REF}
          predicate_type: slsaprovenance

  # Integration test: sign and verify image with Cosign v1
  # NOTE: v1 uses a different key format than v2/v3, so we generate keys dynamically
  integration-test-v1:
    docker:
      - image: cimg/base:current-22.04
    environment:
      IMAGE_TTL: 1h
    steps:
      - checkout
      - setup_remote_docker:
          docker_layer_caching: true
      - cosign-orb/install:
          version: "1.13.6"
      - cosign-orb/generate_key_pair:
          password: "test-password-v1"
      - run:
          name: Generate unique image reference
          command: |
            IMAGE_UUID=$(echo "${CIRCLE_WORKFLOW_ID}" | head -c 8)
            # Use different suffix to avoid collision with other tests
            IMAGE_REF="ttl.sh/cosign-orb-test-v1-${IMAGE_UUID}:${IMAGE_TTL}"
            echo "export IMAGE_REF='${IMAGE_REF}'" >> "${BASH_ENV}"
            echo "Test image: ${IMAGE_REF}"
      - run:
          name: Build and push test image
          command: |
            # SECURITY: ttl.sh is a third-party service. DO NOT include sensitive data in test images.
            echo "Test image built at $(date -u +%Y-%m-%dT%H:%M:%SZ)" > testfile.txt
            printf 'FROM scratch\nCOPY testfile.txt /testfile.txt\n' > Dockerfile
            docker build -t "${IMAGE_REF}" .
            # Push directly to ttl.sh (anonymous push supported)
            docker push "${IMAGE_REF}"
            echo "Pushed test image to ${IMAGE_REF}"
      - cosign-orb/sign_image:
          image: ${IMAGE_REF}
          annotations: "build.source=circleci,build.version=v1"
      - cosign-orb/verify_image:
          image: ${IMAGE_REF}
      - run:
          name: Verify annotations are present in signature
          command: |
            # Verify signature with annotation check - fails if annotation doesn't match
            # Check both annotations to verify comma-separated parsing works
            # Note: v1 doesn't use --private-infrastructure flag
            printf '%s' "${COSIGN_PUBLIC_KEY}" | base64 --decode > cosign-verify.pub
            cosign verify --key cosign-verify.pub -a build.source=circleci -a build.version=v1 "${IMAGE_REF}"
            rm -f cosign-verify.pub
            echo "Annotations verified successfully"
      - run:
          name: Create test attestation predicate
          command: |
            printf '{"buildType":"https://example.com/test-build","builder":{"id":"https://circleci.com"},"invocation":{"configSource":{}}}\n' > predicate.json
      - cosign-orb/attest:
          image: ${IMAGE_REF}
          predicate: predicate.json
          predicate_type: slsaprovenance
      - cosign-orb/verify_attestation:
          image: ${IMAGE_REF}
          predicate_type: slsaprovenance

  # Integration test: image references against a registry with a port.
  # The registry runs on the machine's own Docker Engine, so cosign, crane and
  # docker all reach it at localhost:5000. Covers a tag reference and a digest
  # reference for sign_image and attest, then verifies both by digest.
  integration-test-image-refs:
    parameters:
      digest_tool:
        type: enum
        enum: ["crane", "docker"]
        description: Tool the orb uses to read digests. The docker run has no crane on PATH.
      version:
        type: string
        description: Cosign version to install.
    machine:
      image: ubuntu-2204:current
    environment:
      REGISTRY: localhost:5000
    steps:
      - checkout
      - run:
          name: Prepare install path and tools
          command: |
            mkdir -p /home/circleci/bin
            echo 'export PATH="/home/circleci/bin:${PATH}"' >> "${BASH_ENV}"
            command -v jq || (sudo apt-get update && sudo apt-get install -y jq)
      - when:
          condition:
            equal: [crane, << parameters.digest_tool >>]
          steps:
            - run:
                name: Install crane
                command: |
                  CRANE_VERSION="0.20.2"
                  CRANE_SHA256="c14340087103ba9dadf61d45acd20675490fd0ccbd56ac7901fc1b502137f44b"
                  curl -fsSL -o crane.tar.gz \
                    "https://github.com/google/go-containerregistry/releases/download/v${CRANE_VERSION}/go-containerregistry_Linux_x86_64.tar.gz"
                  echo "${CRANE_SHA256}  crane.tar.gz" | sha256sum -c -
                  tar -xzf crane.tar.gz -C /home/circleci/bin crane
                  rm crane.tar.gz
                  crane version
      - when:
          condition:
            equal: [docker, << parameters.digest_tool >>]
          steps:
            - run:
                name: Confirm crane is absent
                command: |
                  if command -v crane; then
                    echo "ERROR: crane is on PATH, so the docker path would not be tested."
                    exit 1
                  fi
      - run:
          name: Start registry:2 on localhost:5000
          command: |
            # mirror.gcr.io serves the Docker Hub registry:2 image without Docker Hub's anonymous pull limits.
            docker run -d --name registry -p 5000:5000 mirror.gcr.io/library/registry:2
            for i in $(seq 1 30); do
              curl -fsS "http://${REGISTRY}/v2/" > /dev/null && exit 0
              sleep 1
            done
            echo "ERROR: registry did not start"
            docker logs registry
            exit 1
      - cosign-orb/install:
          version: << parameters.version >>
          caching: false
      - cosign-orb/generate_key_pair:
          password: "test-password-image-refs"
      - run:
          name: Build and push test images
          command: |
            # SECURITY: DO NOT include sensitive data in test images.
            printf 'FROM scratch\nCOPY testfile.txt /testfile.txt\n' > Dockerfile
            for name in tag-ref digest-ref; do
              echo "${name} test image built at $(date -u +%Y-%m-%dT%H:%M:%SZ)" > testfile.txt
              docker build -t "${REGISTRY}/cosign-orb/${name}:1.0" .
              docker push "${REGISTRY}/cosign-orb/${name}:1.0"
            done
            # Digests read straight from the registry API, independent of the orb.
            for name in tag-ref digest-ref; do
              digest=$(curl -fsSI -H "Accept: application/vnd.docker.distribution.manifest.v2+json" \
                -H "Accept: application/vnd.oci.image.manifest.v1+json" \
                -H "Accept: application/vnd.docker.distribution.manifest.list.v2+json" \
                -H "Accept: application/vnd.oci.image.index.v1+json" \
                "http://${REGISTRY}/v2/cosign-orb/${name}/manifests/1.0" | tr -d '\r' | awk -F': ' 'tolower($1)=="docker-content-digest" {print $2}')
              if [[ ! "${digest}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
                echo "ERROR: could not read the digest of ${name}"
                exit 1
              fi
              var=$(echo "${name}" | tr 'a-z-' 'A-Z_')
              echo "export ${var}_DIGEST_REF='${REGISTRY}/cosign-orb/${name}@${digest}'" >> "${BASH_ENV}"
              echo "${name}: ${REGISTRY}/cosign-orb/${name}@${digest}"
            done
            printf '{"buildType":"https://example.com/test-build","builder":{"id":"https://circleci.com"},"invocation":{"configSource":{}}}\n' > predicate.json
      # Tag reference on a registry with a port.
      - cosign-orb/sign_image:
          image: ${REGISTRY}/cosign-orb/tag-ref:1.0
      - cosign-orb/attest:
          image: ${REGISTRY}/cosign-orb/tag-ref:1.0
          predicate: predicate.json
          predicate_type: slsaprovenance
      - cosign-orb/verify_image:
          image: ${TAG_REF_DIGEST_REF}
      - cosign-orb/verify_attestation:
          image: ${TAG_REF_DIGEST_REF}
          predicate_type: slsaprovenance
      # Digest reference on a registry with a port.
      - cosign-orb/sign_image:
          image: ${DIGEST_REF_DIGEST_REF}
      - cosign-orb/attest:
          image: ${DIGEST_REF_DIGEST_REF}
          predicate: predicate.json
          predicate_type: slsaprovenance
      - cosign-orb/verify_image:
          image: ${DIGEST_REF_DIGEST_REF}
      - cosign-orb/verify_attestation:
          image: ${DIGEST_REF_DIGEST_REF}
          predicate_type: slsaprovenance
      - run:
          name: Confirm nothing was signed under a mangled name
          command: |
            # The old parser turned localhost:5000/ns/img into localhost@sha256:... (Docker Hub library/localhost).
            # Signatures must only exist under the two test repositories.
            CATALOG=$(curl -fsS "http://${REGISTRY}/v2/_catalog")
            echo "Registry catalog: ${CATALOG}"
            echo "${CATALOG}" | jq -e '.repositories | sort == ["cosign-orb/digest-ref", "cosign-orb/tag-ref"]'

  # Integration test: bundle_format pins the registry layout.
  # Signs and attests one image with the requested format, checks exactly which
  # objects the registry holds for it, then verifies with the same format.
  integration-test-bundle-format:
    parameters:
      version:
        type: string
        description: Cosign version to install.
      bundle_format:
        type: enum
        enum: ["bundle", "legacy"]
        description: Signature storage format to pin.
    machine:
      image: ubuntu-2204:current
    environment:
      REGISTRY: localhost:5000
      REPO: localhost:5000/cosign-orb/bundle-format
    steps:
      - checkout
      - run:
          name: Prepare install path and tools
          command: |
            mkdir -p /home/circleci/bin
            echo 'export PATH="/home/circleci/bin:${PATH}"' >> "${BASH_ENV}"
            command -v jq || (sudo apt-get update && sudo apt-get install -y jq)
      - run:
          name: Install crane
          command: |
            CRANE_VERSION="0.20.2"
            CRANE_SHA256="c14340087103ba9dadf61d45acd20675490fd0ccbd56ac7901fc1b502137f44b"
            curl -fsSL -o crane.tar.gz \
              "https://github.com/google/go-containerregistry/releases/download/v${CRANE_VERSION}/go-containerregistry_Linux_x86_64.tar.gz"
            echo "${CRANE_SHA256}  crane.tar.gz" | sha256sum -c -
            tar -xzf crane.tar.gz -C /home/circleci/bin crane
            rm crane.tar.gz
      - run:
          name: Start registry:2 on localhost:5000
          command: |
            # mirror.gcr.io serves the Docker Hub registry:2 image without Docker Hub's anonymous pull limits.
            docker run -d --name registry -p 5000:5000 mirror.gcr.io/library/registry:2
            for i in $(seq 1 30); do
              curl -fsS "http://${REGISTRY}/v2/" > /dev/null && exit 0
              sleep 1
            done
            echo "ERROR: registry did not start"
            docker logs registry
            exit 1
      - cosign-orb/install:
          version: << parameters.version >>
          caching: false
      - cosign-orb/generate_key_pair:
          password: "test-password-bundle-format"
      - run:
          name: Build and push test image
          command: |
            # SECURITY: DO NOT include sensitive data in test images.
            # crane always pushes a single image manifest. docker build can push an image index,
            # depending on the engine's image store, and Cosign 3.1.3 cannot verify bundles
            # on a saved index offline (see README).
            echo "bundle_format test image built at $(date -u +%Y-%m-%dT%H:%M:%SZ)" > testfile.txt
            tar -cf layer.tar testfile.txt
            crane append -f layer.tar -t "${REPO}:1.0"
            DIGEST=$(crane digest "${REPO}:1.0")
            echo "export SUBJECT='${REPO}@${DIGEST}'" >> "${BASH_ENV}"
            echo "export SUBJECT_HEX='${DIGEST#sha256:}'" >> "${BASH_ENV}"
            printf '{"buildType":"https://example.com/test-build","builder":{"id":"https://circleci.com"},"invocation":{"configSource":{}}}\n' > predicate.json
      - cosign-orb/sign_image:
          image: ${SUBJECT}
          bundle_format: << parameters.bundle_format >>
      - cosign-orb/attest:
          image: ${SUBJECT}
          predicate: predicate.json
          predicate_type: slsaprovenance
          bundle_format: << parameters.bundle_format >>
      - run:
          name: Check the registry layout
          environment:
            FORMAT: << parameters.bundle_format >>
          command: |
            TAGS=$(crane ls "${REPO}")
            echo "Tags in ${REPO}:"
            echo "${TAGS}"
            has_tag() { printf '%s\n' "${TAGS}" | grep -qxF "$1"; }
            if [[ "${FORMAT}" == "legacy" ]]; then
              has_tag "sha256-${SUBJECT_HEX}.sig" || { echo "ERROR: missing .sig tag"; exit 1; }
              has_tag "sha256-${SUBJECT_HEX}.att" || { echo "ERROR: missing .att tag"; exit 1; }
              if has_tag "sha256-${SUBJECT_HEX}"; then
                echo "ERROR: found a referrers index, so Sigstore bundles were written"
                exit 1
              fi
              echo "Legacy layout confirmed: .sig and .att tags, no referrers."
              exit 0
            fi
            if has_tag "sha256-${SUBJECT_HEX}.sig" || has_tag "sha256-${SUBJECT_HEX}.att"; then
              echo "ERROR: found legacy .sig/.att tags"
              exit 1
            fi
            # registry:2 has no referrers API, so referrers are listed in the sha256-<hex> index tag.
            REFERRERS=$(crane manifest "${REPO}:sha256-${SUBJECT_HEX}" | jq -r '.manifests[].digest')
            if [[ $(printf '%s\n' "${REFERRERS}" | wc -l) -ne 2 ]]; then
              echo "ERROR: expected 2 referrers, found: ${REFERRERS}"
              exit 1
            fi
            PREDICATES=""
            for ref in ${REFERRERS}; do
              MANIFEST=$(crane manifest "${REPO}@${ref}")
              echo "${MANIFEST}" | jq -e '.artifactType == "application/vnd.dev.sigstore.bundle.v0.3+json"' > /dev/null || {
                echo "ERROR: referrer ${ref} is not a Sigstore bundle"; echo "${MANIFEST}"; exit 1; }
              echo "${MANIFEST}" | jq -e --arg d "sha256:${SUBJECT_HEX}" '.subject.digest == $d' > /dev/null || {
                echo "ERROR: referrer ${ref} has the wrong subject"; exit 1; }
              PREDICATES+="$(echo "${MANIFEST}" | jq -r '.annotations["dev.sigstore.bundle.predicateType"]')"$'\n'
            done
            echo "Bundle predicate types:"
            echo "${PREDICATES}"
            printf '%s' "${PREDICATES}" | grep -qxF "https://sigstore.dev/cosign/sign/v1" || { echo "ERROR: no signature bundle"; exit 1; }
            printf '%s' "${PREDICATES}" | grep -qxF "https://slsa.dev/provenance/v0.2" || { echo "ERROR: no attestation bundle"; exit 1; }
            echo "Bundle layout confirmed: one signature and one attestation referrer, no legacy tags."
      - cosign-orb/verify_image:
          image: ${SUBJECT}
          bundle_format: << parameters.bundle_format >>
      - cosign-orb/verify_attestation:
          image: ${SUBJECT}
          predicate_type: slsaprovenance
          bundle_format: << parameters.bundle_format >>
      # Offline verification of saved bundles needs Cosign 3; Cosign 2.6.5 cannot read them.
      - when:
          condition:
            or:
              - equal: ["3.1.3", << parameters.version >>]
              - equal: [legacy, << parameters.bundle_format >>]
          steps:
            - run:
                name: Verify offline from cosign save
                command: |
                  cosign save --dir saved "${SUBJECT}"
                  printf '%s' "${COSIGN_PUBLIC_KEY}" | base64 --decode > offline.pub
                  cosign verify --private-infrastructure --key offline.pub --local-image saved
                  cosign verify-attestation --private-infrastructure --type slsaprovenance --key offline.pub --local-image saved
                  rm -f offline.pub

  # Integration test: sign and verify blob with Cosign v3
  integration-test-blob-v3:
    executor: docker-executor
    steps:
      - checkout
      - cosign-orb/install:
          version: "3.1.3"
      - cosign-orb/generate_key_pair:
          password: "test-password-blob-v3"
      - run:
          name: Create test blob file
          command: |
            # SECURITY: DO NOT include sensitive data in test files
            echo "Test blob created at $(date -u +%Y-%m-%dT%H:%M:%SZ)" > testblob.txt
            echo "Created test blob: testblob.txt"
      - cosign-orb/sign_blob:
          blob: testblob.txt
          signature_output: testblob.txt.sig
      - run:
          name: Verify signature file was created
          command: |
            if [[ ! -f testblob.txt.sig ]]; then
              echo "ERROR: Signature file was not created"
              exit 1
            fi
            echo "Signature file exists: testblob.txt.sig"
      - cosign-orb/verify_blob:
