version: 2.1
setup: true
orbs:
  orb-tools: circleci/orb-tools@12.3
  shellcheck: circleci/shellcheck@3.4

filters: &filters
  tags:
    only: /.*/

jobs:
  test-env-subst:
    docker:
      - image: cimg/base:current
    steps:
      - checkout
      - run:
          name: Run circleci env subst tests
          command: bash test/env_subst_test.sh
  test-shell-conventions:
    docker:
      - image: cimg/base:current
    steps:
      - checkout
      - run:
          name: Run shell convention tests
          command: bash test/shell_conventions_test.sh
  test-image-ref:
    docker:
      - image: cimg/base:current
    steps:
      - checkout
      - run:
          name: Run image reference tests
          command: bash test/image_ref_test.sh
  test-bundle-format:
    docker:
      - image: cimg/base:current
    steps:
      - checkout
      - run:
          name: Run bundle format tests
          command: bash test/bundle_format_test.sh
  test-verify:
    docker:
      - image: cimg/base:current
    steps:
      - checkout
      - run:
          name: Run verify signature tests
          command: bash test/verify_test.sh
  test-generate-key-pair:
    docker:
      - image: cimg/base:current
    steps:
      - checkout
      - run:
          name: Run generate_key_pair tests
          command: bash test/generate_key_pair_test.sh
  test-key-files:
    docker:
      - image: cimg/base:current
    steps:
      - checkout
      - run:
          name: Run key file tests
          command: bash test/key_files_test.sh
  test-install:
    docker:
      - image: cimg/base:current
    steps:
      - checkout
      - run:
          name: Run install contract tests
          command: bash test/install_test.sh

workflows:
  lint-pack:
    jobs:
      - test-env-subst:
          filters: *filters
      - test-shell-conventions:
          filters: *filters
      - test-image-ref:
          filters: *filters
      - test-bundle-format:
          filters: *filters
      - test-verify:
          filters: *filters
      - test-generate-key-pair:
          filters: *filters
      - test-key-files:
          filters: *filters
      - test-install:
          filters: *filters
      - orb-tools/lint:
          filters: *filters
      - orb-tools/pack:
          filters: *filters
      - orb-tools/review:
          filters: *filters
      - shellcheck/check:
          filters: *filters
      # Triggers the next workflow in the Orb Development Kit.
      - orb-tools/continue:
          pipeline_number: << pipeline.number >>
          vcs_type: << pipeline.project.type >>
          orb_name: cosign-orb
          requires:
            - test-env-subst
            - test-shell-conventions
            - test-image-ref
            - test-bundle-format
            - test-verify
            - test-generate-key-pair
            - test-key-files
            - test-install
            - orb-tools/lint
            - orb-tools/pack
            - orb-tools/review
            - shellcheck/check
          filters: *filters
