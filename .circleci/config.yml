version: 2.1
setup: true
orbs:
  orb-tools: circleci/orb-tools@12.3
  shellcheck: circleci/shellcheck@3.4

filters: &filters
  tags:
    only: /.*/

jobs:
  test-image-ref:
    docker:
      - image: cimg/base:current
    steps:
      - checkout
      - run:
          name: Run image reference tests
          command: bash test/image_ref_test.sh
  test-bundle-format:
    docker:
      - image: cimg/base:current
    steps:
      - checkout
      - run:
          name: Run bundle format tests
          command: bash test/bundle_format_test.sh

workflows:
  lint-pack:
    jobs:
      - test-image-ref:
          filters: *filters
      - test-bundle-format:
          filters: *filters
      - orb-tools/lint:
          filters: *filters
      - orb-tools/pack:
          filters: *filters
      - orb-tools/review:
          filters: *filters
      - shellcheck/check:
          filters: *filters
      # Triggers the next workflow in the Orb Development Kit.
      - orb-tools/continue:
          pipeline_number: << pipeline.number >>
          vcs_type: << pipeline.project.type >>
          orb_name: cosign-orb
          requires: [test-image-ref, test-bundle-format, orb-tools/lint, orb-tools/pack, orb-tools/review, shellcheck/check]
          filters: *filters
