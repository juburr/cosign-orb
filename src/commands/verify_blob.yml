description: Verifies a blob signature using Cosign. Supports public key and keyless verification.
parameters:
  blob:
    type: string
    description: Path to the file to verify.
  signature:
    type: string
    description: Path to the signature file.
  keyless:
    type: boolean
    description: |
      Use keyless verification. When enabled, verifies using certificate identity and OIDC issuer
      instead of a public key. Requires the certificate file from keyless signing.
      An identity and issuer left empty are auto-detected from the job: on CircleCI from
      CIRCLE_ORGANIZATION_ID and CIRCLE_PROJECT_ID, and on GitHub Actions from the repository,
      so that signatures made by any of its workflows verify.
    default: false
  certificate:
    type: string
    description: |
      Path to the certificate file (keyless only). Required when keyless is true.
      This is the certificate file sign_blob wrote during keyless signing (its output_certificate).
    default: ""
  public_key:
    type: env_var_name
    description: Name of the environment variable that holds the base64-encoded public key. Ignored when keyless is true.
    default: COSIGN_PUBLIC_KEY
  certificate_identity:
    type: string
    description: |
      Expected identity in the Fulcio certificate (keyless only).
      CircleCI: "https://circleci.com/api/v2/projects/<project-id>/pipeline-definitions/<pipeline-def-id>"
      GitHub Actions: "https://github.com/<owner>/<repo>/.github/workflows/<file>@<ref>"
      If neither this nor certificate_identity_regexp is set, a regexp is auto-detected from the job.
    default: ""
  certificate_identity_regexp:
    type: string
    description: |
      Regular expression to match certificate identity (keyless only).
      CircleCI: "https://circleci.com/api/v2/projects/<project-id>/pipeline-definitions/.*"
      GitHub Actions: '^https://github\.com/<owner>/<repo>/\.github/workflows/'
      If not provided (and certificate_identity is empty), auto-detected from the job.
    default: ""
  certificate_oidc_issuer:
    type: string
    description: |
      Expected OIDC issuer in the Fulcio certificate (keyless only).
      CircleCI: "https://oidc.circleci.com/org/<org-id>"
      GitHub Actions: "https://token.actions.githubusercontent.com"
      If not provided, auto-detected from the job.
    default: ""
  certificate_oidc_issuer_regexp:
    type: string
    description: |
      Regular expression to match OIDC issuer (keyless only).
      Example: "https://oidc.circleci.com/org/.*"
    default: ""
steps:
  - run:
      name: Verify blob signature
      environment:
        PARAM_BLOB: << parameters.blob >>
        PARAM_SIGNATURE: << parameters.signature >>
        PARAM_KEYLESS: << parameters.keyless >>
        PARAM_CERTIFICATE: << parameters.certificate >>
        PARAM_PUBLIC_KEY: << parameters.public_key >>
        PARAM_CERTIFICATE_IDENTITY: << parameters.certificate_identity >>
        PARAM_CERTIFICATE_IDENTITY_REGEXP: << parameters.certificate_identity_regexp >>
        PARAM_CERTIFICATE_OIDC_ISSUER: << parameters.certificate_oidc_issuer >>
        PARAM_CERTIFICATE_OIDC_ISSUER_REGEXP: << parameters.certificate_oidc_issuer_regexp >>
        SCRIPT_CI_LIB: << include(scripts/lib/ci.sh) >>
      command: << include(scripts/verify_blob.sh) >>
