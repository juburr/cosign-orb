description: Signs a blob (arbitrary file) using Cosign. Supports private key signing and keyless signing via OIDC.
parameters:
  blob:
    type: string
    description: Path to the file to sign.
  output_signature:
    type: string
    description: |
      Path of the file to write the signature to (Cosign's --output-signature).
      If empty, the signature is printed to stdout.
    default: ""
  keyless:
    type: boolean
    description: |
      Use keyless signing with the job's OIDC identity. When enabled, signs using Fulcio certificates
      and records signatures in the Rekor transparency log. No private key required.
      Needs an OIDC token: on CircleCI Cloud or Server 4.x+, or in a GitHub Actions job with the
      id-token: write permission.
      When using keyless mode, output_certificate is required to save the Fulcio certificate.
    default: false
  output_certificate:
    type: string
    description: |
      Path of the file to write the Fulcio certificate to (Cosign's --output-certificate).
      Keyless only, and required when keyless is true.
      The certificate is needed for verification alongside the signature.
    default: ""
  private_key:
    type: env_var_name
    description: Name of the environment variable that holds the base64-encoded private key. Ignored when keyless is true.
    default: COSIGN_PRIVATE_KEY
  password:
    type: env_var_name
    description: Name of the environment variable that holds the password for the private key. Ignored when keyless is true.
    default: COSIGN_PASSWORD
  fulcio_url:
    type: string
    description: Fulcio CA URL for keyless signing.
    default: "https://fulcio.sigstore.dev"
  rekor_url:
    type: string
    description: Rekor transparency log URL for keyless signing.
    default: "https://rekor.sigstore.dev"
  oidc_issuer:
    type: string
    description: |
      OIDC issuer URL (for private Fulcio instances only).
      If empty, the job's own issuer is used: its CircleCI organization's, or GitHub Actions'.
    default: ""
steps:
  - run:
      name: Sign blob
      environment:
        PARAM_BLOB: << parameters.blob >>
        PARAM_OUTPUT_SIGNATURE: << parameters.output_signature >>
        PARAM_KEYLESS: << parameters.keyless >>
        PARAM_OUTPUT_CERTIFICATE: << parameters.output_certificate >>
        PARAM_PRIVATE_KEY: << parameters.private_key >>
        PARAM_PASSWORD: << parameters.password >>
        PARAM_FULCIO_URL: << parameters.fulcio_url >>
        PARAM_REKOR_URL: << parameters.rekor_url >>
        PARAM_OIDC_ISSUER: << parameters.oidc_issuer >>
        SCRIPT_CI_LIB: << include(scripts/lib/ci.sh) >>
      command: << include(scripts/sign_blob.sh) >>
