description: |
  Generates a Cosign key pair for signing and verification.

  WARNING: This command is intended for development and testing purposes only.
  For production use, store keys securely in a key management system (AWS KMS,
  HashiCorp Vault, GCP KMS, etc.) or at minimum in CircleCI contexts for reuse.
  The base64-encoded keys and the password are exported to environment variables
  for later steps, and the raw key files are securely deleted after export.

  To choose the password, set the variable named by password_env_var before this
  step. Otherwise a random password is generated.
parameters:
  private_key_env_var:
    type: env_var_name
    description: Name of the environment variable to write the base64-encoded private key to, for later steps.
    default: COSIGN_PRIVATE_KEY
  public_key_env_var:
    type: env_var_name
    description: Name of the environment variable to write the base64-encoded public key to, for later steps.
    default: COSIGN_PUBLIC_KEY
  password_env_var:
    type: env_var_name
    description: |
      Name of the environment variable that holds the password for the private key.
      If the variable is set and not empty, its value encrypts the private key. Otherwise a random
      password is generated. Either way, the password is written to this variable for later steps.
    default: COSIGN_PASSWORD
steps:
  - run:
      name: Generate Cosign key pair
      environment:
        PARAM_PRIVATE_KEY_ENV_VAR: << parameters.private_key_env_var >>
        PARAM_PUBLIC_KEY_ENV_VAR: << parameters.public_key_env_var >>
        PARAM_PASSWORD_ENV_VAR: << parameters.password_env_var >>
      command: << include(scripts/generate_key_pair.sh) >>
